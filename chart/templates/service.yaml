apiVersion: v1
kind: Service
metadata:
  name: {{ include "frigate-notify.fullname" . }}
  labels:
    {{- include "frigate-notify.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.mediaPort }}
      targetPort: media
      protocol: TCP
      name: media
  selector:
    {{- include "frigate-notify.selectorLabels" . | nindent 4 }}
