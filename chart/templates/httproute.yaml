{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "frigate-notify.fullname" . }}
  labels:
    {{- include "frigate-notify.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | quote }}
      # Always the media port: the health port serves every handler
      # bound to it, so it must never be reachable through a Gateway.
      backendRefs:
        - name: {{ include "frigate-notify.fullname" . }}
          port: {{ .Values.service.mediaPort }}
{{- end }}
