apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frigate-notify.fullname" . }}
  labels:
    {{- include "frigate-notify.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "frigate-notify.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when only the rendered config Secret changes — a
        # Secret edit alone does not restart a Deployment otherwise.
        checksum/config: {{ .Values.config | toYaml | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "frigate-notify.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: "CONFIG_PATH"
              value: "/etc/frigate-notify/config.yaml"
            {{- $extra := dict }}
            {{- range .Values.extraEnv }}{{- $_ := set $extra .name true }}{{- end }}
            {{- range concat (include "frigate-notify.otelEnv" . | fromYamlArray) (include "frigate-notify.storeEnv" . | fromYamlArray) }}
            {{- if not (hasKey $extra .name) }}
            {{- list . | toYaml | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: media
              containerPort: {{ .Values.service.mediaPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: "config"
              mountPath: "/etc/frigate-notify"
              readOnly: true
      volumes:
        - name: "config"
          secret:
            secretName: {{ include "frigate-notify.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
