{{- define "frigate-notify.mongoOperatorSpec" -}}
{{- $secretName := include "frigate-notify.mongoAuthSecret" . }}
type: ReplicaSet
members: {{ .Values.mongo.members }}
version: {{ (.Values.mongo.image | splitList ":" | last) | quote }}
security:
  authentication:
    modes: ["SCRAM"]
users:
  - name: {{ .Values.mongo.user | quote }}
    db: admin
    passwordSecretRef:
      name: {{ $secretName }}
      key: password
    scramCredentialsSecretName: {{ include "frigate-notify.mongoName" . }}-scram
    roles:
      # mongoDBName in internal/db/mongo.go.
      - name: readWrite
        db: frigate-notify
statefulSet:
  spec:
    volumeClaimTemplates:
      - metadata:
          name: data-volume
        spec:
          accessModes: [ReadWriteOnce]
          {{- with .Values.mongo.storage.storageClass }}
          storageClassName: {{ . | quote }}
          {{- end }}
          resources:
            requests:
              storage: {{ .Values.mongo.storage.size }}
{{- end }}
{{- define "frigate-notify.mongoStatefulSetSpec" -}}
{{- $ctx := dict "root" . "component" "mongo" }}
{{- $secretName := include "frigate-notify.mongoAuthSecret" . }}
replicas: 1
serviceName: {{ include "frigate-notify.mongoName" . }}
selector:
  matchLabels:
    {{- include "frigate-notify.componentSelector" $ctx | nindent 4 }}
template:
  metadata:
    labels:
      {{- include "frigate-notify.componentSelector" $ctx | nindent 6 }}
  spec:
    # Image uid; the app's 65532 can't write the volume.
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: mongo
        image: {{ .Values.mongo.image | quote }}
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            value: {{ .Values.mongo.user | quote }}
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $secretName }}
                key: password
          {{- with .Values.mongo.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
          - name: mongo
            containerPort: 27017
        livenessProbe:
          exec:
            command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"]
          initialDelaySeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"]
          timeoutSeconds: 10
        resources:
          {{- toYaml .Values.mongo.resources | nindent 10 }}
        volumeMounts:
          - name: data
            mountPath: /data/db
volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      {{- with .Values.mongo.storage.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.mongo.storage.size }}
{{- end }}
{{- if .Values.mongo.enabled }}
{{- $ctx := dict "root" . "component" "mongo" }}
{{- $secretName := include "frigate-notify.mongoAuthSecret" . }}
{{- /* Reuse the existing password; lookup is empty on first install. */}}
{{- $password := randAlphaNum 32 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "frigate-notify.componentLabels" $ctx | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
stringData:
  password: {{ $password | quote }}
  {{- if eq .Values.mongo.mode "statefulset" }}
  url: {{ printf "mongodb://%s:%s@%s:27017/?authSource=admin" .Values.mongo.user $password (include "frigate-notify.mongoName" .) | quote }}
  {{- end }}
---
{{- if eq .Values.mongo.mode "operator" }}
# The operator publishes <name>-admin-<user>; its connectionString.standard
# is DB_URL.
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: {{ include "frigate-notify.mongoName" . }}
  labels:
    {{- include "frigate-notify.componentLabels" $ctx | nindent 4 }}
spec:
  {{- include "frigate-notify.spec" (dict "base" (include "frigate-notify.mongoOperatorSpec" .) "extra" .Values.mongo.extraSpec) | nindent 2 }}
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "frigate-notify.mongoName" . }}
  labels:
    {{- include "frigate-notify.componentLabels" $ctx | nindent 4 }}
spec:
  ports:
    - port: 27017
      targetPort: mongo
      name: mongo
  selector:
    {{- include "frigate-notify.componentSelector" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "frigate-notify.mongoName" . }}
  labels:
    {{- include "frigate-notify.componentLabels" $ctx | nindent 4 }}
spec:
  {{- include "frigate-notify.spec" (dict "base" (include "frigate-notify.mongoStatefulSetSpec" .) "extra" .Values.mongo.extraSpec) | nindent 2 }}
{{- end }}
{{- end }}
