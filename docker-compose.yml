# Example: frigate-notify with Valkey (state) and PostgreSQL (audit log).
# Assumes Frigate, MQTT and Home Assistant already exist; see README.
services:
  frigate-notify:
    image: ghcr.io/connorsapps/frigate-notifications:latest
    restart: unless-stopped
    environment:
      CONFIG_PATH: /etc/frigate-notify/config.yaml
      # Override redis.url / db.url from config.yaml.
      REDIS_URL: redis://valkey:6379
      DB_URL: postgres://frigate-notify:${POSTGRES_PASSWORD:-change-me}@postgres:5432/frigate-notify
    volumes:
      - ./config.yaml:/etc/frigate-notify/config.yaml:ro
    ports:
      # Signed media links only; :8080 (health, metrics) stays internal.
      - "8081:8081"
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frigate-notify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: frigate-notify
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frigate-notify"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
