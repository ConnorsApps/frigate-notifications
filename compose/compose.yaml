# Frigate Notifications with Valkey (state) and PostgreSQL (history). Addresses
# and tokens come from .env; people, cameras and rules from config.yaml. See
# https://connorsapps.github.io/frigate-notifications/docker-compose/
services:
  frigate-notify:
    image: ghcr.io/connorsapps/frigate-notifications:latest # or a release, e.g. :0.2.0
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /etc/frigate-notify/config.yaml
      REDIS_URL: redis://valkey:6379
      DB_URL: postgres://frigate-notify:${POSTGRES_PASSWORD}@postgres:5432/frigate-notify
    volumes:
      - ./config.yaml:/etc/frigate-notify/config.yaml:ro
    ports:
      # Picture links only; :8080 (health) stays internal.
      - "8081:8081"
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frigate-notify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: frigate-notify
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frigate-notify"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
